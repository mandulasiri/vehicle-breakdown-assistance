<!DOCTYPE html>
<html>
<head>
    <title>Support Chat</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{
            background: linear-gradient(to right,#1e3c72,#2a5298);
            font-family: Arial, sans-serif;
        }

        .chat-container{
            width: 80%;
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .chat-header{
            background: #dc3545;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .chat-box{
            height: 400px;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message{
            padding: 10px;
            margin: 10px;
            border-radius: 10px;
            width: fit-content;
            max-width: 70%;
        }

        .user{
            background: #0d6efd;
            color: white;
            margin-left: auto;
        }

        .support{
            background: #e9ecef;
            color: black;
        }

        .chat-input{
            display: flex;
            padding: 15px;
            background: white;
        }

        .chat-input input{
            flex: 1;
            margin-right: 10px;
        }

    </style>
</head>

<body>

<div class="chat-container">

    <div class="chat-header">
        <i class="fas fa-comments"></i>
        Vehicle Support Chat
    </div>

    <div class="chat-box" id="chatBox">

        <div class="message support">
            👋 Welcome! How can we help you today?
        </div>

    </div>

    <div class="chat-input">

        <input type="text"
               class="form-control"
               id="messageInput"
               placeholder="Type your message...">

        <button class="btn btn-primary"
                onclick="sendMessage()">
            <i class="fas fa-paper-plane"></i>
        </button>

    </div>

</div>

<script>

function sendMessage(){

    let input = document.getElementById("messageInput");

    let text = input.value.trim();

    if(text === "") return;

    let chatBox = document.getElementById("chatBox");

    let userMsg = document.createElement("div");

    userMsg.className = "message user";

    userMsg.innerText = text;

    chatBox.appendChild(userMsg);

    setTimeout(function(){

        let supportMsg = document.createElement("div");

        supportMsg.className = "message support";

        supportMsg.innerText =
        "🔧 Support Team: Your request has been received. A mechanic will contact you soon.";

        chatBox.appendChild(supportMsg);

        chatBox.scrollTop = chatBox.scrollHeight;

    },1000);

    input.value = "";

    chatBox.scrollTop = chatBox.scrollHeight;

}

</script>

</body>
</html>
