<!DOCTYPE html>
<html>
<head>

<title>Request Breakdown Help</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
background:linear-gradient(135deg,#36d1dc,#5b86e5);
min-height:100vh;
}

.form-box{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,0.3);
margin-top:30px;
}

#map{
height:350px;
width:100%;
border-radius:15px;
margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<div class="form-box">

<h2 class="text-center mb-4">
🚗 Vehicle Breakdown Request
</h2>

<form method="POST">

<div class="mb-3">
<label>Vehicle Type</label>
<select class="form-control" name="vehicle">
<option>Car</option>
<option>Bike</option>
<option>Truck</option>
<option>Bus</option>
</select>
</div>

<div class="mb-3">
<label>Problem Description</label>
<textarea class="form-control"
name="problem"
rows="4"
required></textarea>
</div>

<div class="mb-3">
<label>Location</label>
<input class="form-control"
id="location"
name="location"
required>
</div>

<button type="button"
class="btn btn-info"
onclick="getLocation()">
📍 Detect My Location
</button>

<button type="submit"
class="btn btn-danger">
🔧 Send Request
</button>

</form>

<div id="map"></div>

</div>

</div>

<script>

let map;
let marker;

function initMap(){

const center={
lat:17.3850,
lng:78.4867
};

map=new google.maps.Map(
document.getElementById("map"),
{
zoom:12,
center:center
});

marker=new google.maps.Marker({
position:center,
map:map,
title:"Your Location"
});

/* Nearby Mechanics */

const mechanics=[

{
lat:17.3950,
lng:78.4967,
name:"QuickFix Mechanics"
},

{
lat:17.3750,
lng:78.4767,
name:"Roadside Rescue"
},

{
lat:17.4050,
lng:78.4867,
name:"Auto Care Center"
}

];

mechanics.forEach(function(mechanic){

new google.maps.Marker({

position:{
lat:mechanic.lat,
lng:mechanic.lng
},

map:map,

title:"🔧 "+mechanic.name

});

});

}

function getLocation(){

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(

function(position){

let lat=position.coords.latitude;
let lng=position.coords.longitude;

document.getElementById("location").value=
lat+","+lng;

let userLocation={
lat:lat,
lng:lng
};

map.setCenter(userLocation);

marker.setPosition(userLocation);

});

}

}

</script>

<script async defer
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDjdJmLto4E-fe14D1CISfAOeVO7UAaDjg&callback=initMap">
</script>

</body>
</html>
