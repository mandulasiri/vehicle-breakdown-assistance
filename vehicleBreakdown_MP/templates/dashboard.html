<!DOCTYPE html>
<html>
<head>

<title>Vehicle Breakdown Dashboard</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
background:linear-gradient(135deg,#667eea,#764ba2);
min-height:100vh;
}

.dashboard-title{
color:white;
text-align:center;
padding:20px;
font-weight:bold;
}

.stat-card{
color:white;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
margin-bottom:20px;
}

.users{background:#0d6efd;}
.requests{background:#dc3545;}
.mechanics{background:#198754;}
.ai{background:#6f42c1;}

.feature-card{
background:white;
border-radius:20px;
padding:25px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
transition:0.3s;
}

.feature-card:hover{
transform:translateY(-5px);
}

.feature-card i{
font-size:45px;
color:#ff5722;
margin-bottom:10px;
}

</style>

</head>

<body>

<div class="container">

<h1 class="dashboard-title">
🚗 Vehicle Breakdown Emergency Dashboard
</h1>

<div class="row">

<div class="col-md-3">
<div class="stat-card users">
<h2 id="userCount">0</h2>
<p>👤 Users</p>
</div>
</div>

<div class="col-md-3">
<div class="stat-card requests">
<h2 id="requestCount">0</h2>
<p>🚗 Requests</p>
</div>
</div>

<div class="col-md-3">
<div class="stat-card mechanics">
<h2>15</h2>
<p>🔧 Mechanics</p>
</div>
</div>

<div class="col-md-3">
<div class="stat-card ai">
<h2>92%</h2>
<p>🤖 AI Prediction Accuracy</p>
</div>
</div>

</div>

<div class="row mt-4">

<div class="col-md-4">
<div class="feature-card">
<i class="fas fa-tools"></i>
<h4>Request Help</h4>
<p>Send vehicle breakdown request.</p>
<a href="/request" class="btn btn-danger">Open</a>
</div>
</div>

<div class="col-md-4">
<div class="feature-card">
<i class="fas fa-comments"></i>
<h4>Live Chat</h4>
<p>Chat with support team.</p>
<a href="/chat" class="btn btn-primary">Open</a>
</div>
</div>

<div class="col-md-4">
<div class="feature-card">
<i class="fas fa-chart-line"></i>
<h4>Analytics</h4>
<p>View project statistics.</p>
<a href="/chart" class="btn btn-success">Open</a>
</div>
</div>

</div>

<div class="text-center mt-5">

<button class="btn btn-danger btn-lg"
onclick="sendSOS()">

🚨 EMERGENCY SOS

</button>

</div>

</div>

<script>

fetch("/stats")
.then(response=>response.json())
.then(data=>{

document.getElementById("userCount").innerHTML=data.users;
document.getElementById("requestCount").innerHTML=data.requests;

});

function sendSOS(){

fetch("/sos",{
method:"POST"
})
.then(()=>alert("🚨 SOS Alert Sent Successfully!"));

}

</script>

</body>
</html>
